  # Cost optimization
  - id: azure-disk-unattached
    name: Unattached managed disks
    category: cost
    severity: low
    starter: true
    frameworks: [FinOps]
    resource: azure.disk
    description: Managed disks not attached to any virtual machine.
    filters:
      - type: value
        key: properties.diskState
        value: Unattached
  - id: azure-publicip-unassociated
    name: Unassociated public IPs
    category: cost
    severity: low
    starter: true
    frameworks: [FinOps]
    resource: azure.publicip
    description: Public IP addresses not attached to any resource.
    filters:
      - type: value
        key: properties.ipConfiguration
        value: absent
  - id: azure-vm-stopped-not-deallocated
    name: VMs stopped but still billed
    category: cost
    severity: low
    frameworks: [FinOps]
    resource: azure.vm
    description: Virtual machines stopped from inside the OS, so compute is still billed.
    filters:
      - type: instance-view
        key: statuses[].code
        op: in
        value_type: swap
        value: PowerState/stopped
  - id: azure-vm-low-cpu
    name: Idle virtual machines
    category: cost
    severity: low
    frameworks: [FinOps]
    resource: azure.vm
    description: Virtual machines averaging under 5% CPU over the last 7 days.
    filters:
      - type: metric
        metric: Percentage CPU
        aggregation: average
        op: lt
        threshold: 5
        timeframe: 168
  - id: azure-snapshot-old
    name: Disk snapshots older than 90 days
    category: cost
    severity: low
    frameworks: [FinOps]
    resource: azure.snapshot
    description: Managed disk snapshots created more than 90 days ago.
    filters:
      - type: value
        key: properties.timeCreated
        value_type: age
        value: 90
        op: gt
  - id: azure-appserviceplan-empty
    name: App Service plans with no apps
    category: cost
    severity: low
    frameworks: [FinOps]
    resource: azure.appserviceplan
    description: App Service plans that host no apps but are still billed.
    filters:
      - type: value
        key: properties.numberOfSites
        value: 0
  - id: azure-nic-unattached
    name: Unattached network interfaces
    category: cost
    severity: low
    frameworks: [FinOps]
    resource: azure.networkinterface
    description: Network interfaces not attached to a virtual machine.
    filters:
      - type: value
        key: properties.virtualMachine
        value: absent
  - id: azure-loadbalancer-empty
    name: Load balancers with no backends
    category: cost
    severity: low
    frameworks: [FinOps]
    resource: azure.loadbalancer
    description: Load balancers with no backend pool configured.
    filters:
      - type: value
        key: properties.backendAddressPools
        value: empty

