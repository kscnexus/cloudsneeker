  UiTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Condition: RunTasks
    Properties:
      Family: cloudsneeker-ui
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "512"
      Memory: "1024"
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: ui
          Image: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/cloudsneeker/ui:${ImageTag}
          Essential: true
          LinuxParameters:
            InitProcessEnabled: true
          PortMappings:
            - ContainerPort: 3000
              Protocol: tcp
          HealthCheck:
            Command:
              - CMD-SHELL
              - wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 60
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref UiLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ui
          Environment:
            - Name: PORT
              Value: "3000"
            - Name: HOSTNAME
              Value: "0.0.0.0"
            - Name: AUTH_URL
              Value: !If [UseHttps, !Sub "https://${DomainName}", !Sub "http://${LoadBalancer.DNSName}"]
            - Name: AUTH_TRUST_HOST
              Value: "true"
            - Name: UI_API_BASE_URL
              Value: http://api.cloudsneeker.local:8080/api/v1
            - Name: UI_API_DOCS_URL
              Value: !If [UseHttps, !Sub "https://${DomainName}/api/v1/docs", !Sub "http://${LoadBalancer.DNSName}/api/v1/docs"]
            - Name: UI_CLOUD_ENABLED
              Value: "false"
            - Name: PROWLER_MCP_SERVER_URL
              Value: http://mcp.cloudsneeker.local:8000/mcp
            - Name: NEXT_PUBLIC_PROWLER_RELEASE_VERSION
              Value: !Ref ImageTag
          Secrets:
            - Name: AUTH_SECRET
              ValueFrom: !Sub "${AppSecretArn}:authSecret::"

  McpTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Condition: RunTasks
    Properties:
      Family: cloudsneeker-mcp
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "256"
      Memory: "512"
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: mcp
          Image: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/cloudsneeker/mcp:${ImageTag}
          Essential: true
          EntryPoint:
            - /app/entrypoint.sh
            - uvicorn
          Command:
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
          LinuxParameters:
            InitProcessEnabled: true
          PortMappings:
            - ContainerPort: 8000
              Protocol: tcp
          HealthCheck:
            Command:
              - CMD-SHELL
              - wget -q -O /dev/null http://127.0.0.1:8000/health || exit 1
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 40
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref McpLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: mcp
          Environment:
            - Name: PROWLER_MCP_TRANSPORT_MODE
              Value: http
            - Name: API_BASE_URL
              Value: http://api.cloudsneeker.local:8080/api/v1

  Neo4jTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Condition: RunTasks
    Properties:
      Family: cloudsneeker-neo4j
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "1024"
      Memory: "4096"
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      Volumes:
        - Name: data
          EFSVolumeConfiguration:
            FilesystemId: !Ref FileSystem
            TransitEncryption: ENABLED
            AuthorizationConfig:
              AccessPointId: !Ref Neo4jAccessPoint
              IAM: ENABLED
      ContainerDefinitions:
        - Name: neo4j
          Image: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/cloudsneeker/neo4j:${ImageTag}
          Essential: true
          LinuxParameters:
            InitProcessEnabled: true
          PortMappings:
            - ContainerPort: 7687
              Protocol: tcp
            - ContainerPort: 7474
              Protocol: tcp
          MountPoints:
            - SourceVolume: data
              ContainerPath: /data
              ReadOnly: false
          HealthCheck:
            Command:
              - CMD-SHELL
              - wget -q -O /dev/null http://127.0.0.1:7474 || exit 1
            Interval: 30
            Timeout: 10
            Retries: 5
            StartPeriod: 180
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref Neo4jLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: neo4j
          Environment:
            - Name: NEO4J_dbms_max__databases
              Value: "1000"
            - Name: NEO4J_server_memory_pagecache_size
              Value: 512M
            - Name: NEO4J_server_memory_heap_initial__size
              Value: 512M
            - Name: NEO4J_server_memory_heap_max__size
              Value: 1G
            - Name: NEO4J_PLUGINS
              Value: '["apoc"]'
            - Name: NEO4J_dbms_security_procedures_allowlist
              Value: apoc.*
            - Name: NEO4J_apoc_export_file_enabled
              Value: "false"
            - Name: NEO4J_apoc_import_file_enabled
              Value: "false"
            - Name: NEO4J_apoc_import_file_use__neo4j__config
              Value: "true"
            - Name: NEO4J_apoc_trigger_enabled
              Value: "false"
            - Name: NEO4J_dbms_connector_bolt_listen__address
              Value: 0.0.0.0:7687
          Secrets:
            - Name: NEO4J_AUTH
              ValueFrom: !Sub "${AppSecretArn}:neo4jAuth::"

  ApiService:
    Type: AWS::ECS::Service
    Condition: RunTasks
    DependsOn:
      - OutputMountA
      - OutputMountB
      - HttpListener
    Properties:
      ServiceName: api
      Cluster: !Ref Cluster
      TaskDefinition: !Ref ApiTaskDefinition
      DesiredCount: 1
      HealthCheckGracePeriodSeconds: 600
      DeploymentConfiguration:
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
        MinimumHealthyPercent: 100
        MaximumPercent: 200
      CapacityProviderStrategy:
        - CapacityProvider: FARGATE
          Weight: 1
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - !Ref PrivateSubnetA
            - !Ref PrivateSubnetB
          SecurityGroups:
            - !Ref AppSecurityGroup
      LoadBalancers:
        - TargetGroupArn: !Ref ApiTargetGroup
          ContainerName: api
          ContainerPort: 8080
      ServiceRegistries:
        - RegistryArn: !GetAtt ApiDiscovery.Arn

  UiService:
    Type: AWS::ECS::Service
    Condition: RunTasks
    DependsOn: HttpListener
    Properties:
      ServiceName: ui
      Cluster: !Ref Cluster
      TaskDefinition: !Ref UiTaskDefinition
      DesiredCount: 2
      HealthCheckGracePeriodSeconds: 120
      DeploymentConfiguration:
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
        MinimumHealthyPercent: 100
        MaximumPercent: 200
      CapacityProviderStrategy:
        - CapacityProvider: FARGATE
          Weight: 1
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - !Ref PrivateSubnetA
            - !Ref PrivateSubnetB
          SecurityGroups:
            - !Ref AppSecurityGroup
      LoadBalancers:
        - TargetGroupArn: !Ref UiTargetGroup
          ContainerName: ui
          ContainerPort: 3000

  WorkerService:
    Type: AWS::ECS::Service
    Condition: RunTasks
    DependsOn:
      - OutputMountA
      - OutputMountB
    Properties:
      ServiceName: worker
      Cluster: !Ref Cluster
      TaskDefinition: !Ref WorkerTaskDefinition
      DesiredCount: 1
      DeploymentConfiguration:
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
        MinimumHealthyPercent: 0
        MaximumPercent: 100
      CapacityProviderStrategy:
        - CapacityProvider: FARGATE
          Weight: 1
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - !Ref PrivateSubnetA
            - !Ref PrivateSubnetB
          SecurityGroups:
            - !Ref AppSecurityGroup

  BeatService:
    Type: AWS::ECS::Service
    Condition: RunTasks
    Properties:
      ServiceName: beat
      Cluster: !Ref Cluster
      TaskDefinition: !Ref BeatTaskDefinition
      DesiredCount: 1
      DeploymentConfiguration:
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
        MinimumHealthyPercent: 0
        MaximumPercent: 100
      CapacityProviderStrategy:
        - CapacityProvider: FARGATE
          Weight: 1
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - !Ref PrivateSubnetA
            - !Ref PrivateSubnetB
          SecurityGroups:
            - !Ref AppSecurityGroup

  McpService:
    Type: AWS::ECS::Service
    Condition: RunTasks
    Properties:
      ServiceName: mcp
      Cluster: !Ref Cluster
      TaskDefinition: !Ref McpTaskDefinition
      DesiredCount: 1
      DeploymentConfiguration:
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
        MinimumHealthyPercent: 0
        MaximumPercent: 100
      CapacityProviderStrategy:
        - CapacityProvider: FARGATE
          Weight: 1
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - !Ref PrivateSubnetA
            - !Ref PrivateSubnetB
          SecurityGroups:
            - !Ref AppSecurityGroup
      ServiceRegistries:
        - RegistryArn: !GetAtt McpDiscovery.Arn

  Neo4jService:
    Type: AWS::ECS::Service
    Condition: RunTasks
    DependsOn:
      - OutputMountA
      - OutputMountB
    Properties:
      ServiceName: neo4j
      Cluster: !Ref Cluster
      TaskDefinition: !Ref Neo4jTaskDefinition
      DesiredCount: 1
      DeploymentConfiguration:
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
        MinimumHealthyPercent: 0
        MaximumPercent: 100
      CapacityProviderStrategy:
        - CapacityProvider: FARGATE
          Weight: 1
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - !Ref PrivateSubnetA
            - !Ref PrivateSubnetB
          SecurityGroups:
            - !Ref Neo4jSecurityGroup
      ServiceRegistries:
        - RegistryArn: !GetAtt Neo4jDiscovery.Arn

  ApiScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Condition: RunTasks
    Properties:
      MaxCapacity: 4
      MinCapacity: 1
      ResourceId: !Sub service/${Cluster}/api
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs
    DependsOn: ApiService

  ApiScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Condition: RunTasks
    Properties:
      PolicyName: cloudsneeker-api-cpu
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ApiScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        TargetValue: 60
        ScaleInCooldown: 120
        ScaleOutCooldown: 60

  UiScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Condition: RunTasks
    DependsOn: UiService
    Properties:
      MaxCapacity: 4
      MinCapacity: 2
      ResourceId: !Sub service/${Cluster}/ui
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs

  UiScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Condition: RunTasks
    Properties:
      PolicyName: cloudsneeker-ui-cpu
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref UiScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        TargetValue: 60
        ScaleInCooldown: 120
        ScaleOutCooldown: 60

Outputs:
  ServiceUrl:
    Condition: RunCompute
    Description: Public address of the web application.
    Value: !If [UseHttps, !Sub "https://${DomainName}", !Sub "http://${LoadBalancer.DNSName}"]
  LoadBalancerDns:
    Condition: RunCompute
    Value: !GetAtt LoadBalancer.DNSName
  DatabaseEndpoint:
    Description: PostgreSQL address. Present while the instance is stopped.
    Value: !GetAtt Database.Endpoint.Address
  CacheEndpoint:
    Condition: RunCompute
    Value: !GetAtt Cache.PrimaryEndPoint.Address
  ClusterName:
    Value: !Ref Cluster
  PlatformMode:
    Value: !Ref PlatformMode
