              ValueFrom: !Sub "${AppSecretArn}:neo4jPassword::"
            - Name: DJANGO_TOKEN_SIGNING_KEY
              ValueFrom: !Sub "${AppSecretArn}:djangoTokenSigningKey::"
            - Name: DJANGO_TOKEN_VERIFYING_KEY
              ValueFrom: !Sub "${AppSecretArn}:djangoTokenVerifyingKey::"
            - Name: DJANGO_SECRETS_ENCRYPTION_KEY
              ValueFrom: !Sub "${AppSecretArn}:djangoSecretsEncryptionKey::"
            - Name: DJANGO_SLACK_CLIENT_ID
