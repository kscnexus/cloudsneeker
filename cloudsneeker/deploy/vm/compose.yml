# Single-VM overlay for ../docker-compose.yml.
#
# The web app runs on Vercel, so this host runs the API, workers, beat, MCP,
# PostgreSQL, Valkey, and Neo4j. Only Caddy listens publicly; every other port
# is bound to loopback.
#
#   cd cloudsneeker/deploy
#   docker compose -f docker-compose.yml -f vm/compose.yml up -d
#
# Needs Docker Compose 2.24+ for !override.

services:
  # Never started here: no command activates the profile.
  cloudsneeker-ui:
    profiles: ["vercel"]

  # Four workers (the .env.example value) topped out near 30 requests a second
  # in the November 2026 load test. Each worker holds about 420 MB, so six
  # still fit beside the 10 GB scan worker, Neo4j and Postgres on 16 GB.
  # Set CLOUDSNEEKER_VM_API_WORKERS in .env to change it.
  cloudsneeker-api:
    environment:
      DJANGO_WORKERS: ${CLOUDSNEEKER_VM_API_WORKERS:-6}
    ports: !override
      - "127.0.0.1:${DJANGO_PORT:-8080}:${DJANGO_PORT:-8080}"

  cloudsneeker-mcp:
    ports: !override
      - "127.0.0.1:8000:8000"

  # A scan that runs away (one AWS scan reached 13.7 GB on this 16 GB host) is
  # killed inside this limit instead of pushing the API and databases into
  # swap. The orphan sweep then marks the scan failed and starts the next one.
  cloudsneeker-worker:
    mem_limit: 10g
    memswap_limit: 10g

  postgres:
    ports: !override
      - "127.0.0.1:${POSTGRES_PORT:-5432}:${POSTGRES_PORT:-5432}"

  valkey:
    ports: !override
      - "127.0.0.1:${VALKEY_PORT:-6379}:6379"

  neo4j:
    ports: !override
      - "127.0.0.1:${NEO4J_PORT:-7687}:7687"

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./vm/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./_data/caddy:/data
    depends_on:
      cloudsneeker-api:
        condition: service_healthy
