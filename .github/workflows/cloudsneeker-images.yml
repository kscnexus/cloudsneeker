name: 'Cloudsneeker: Deploy to Azure'
# After the tests pass on a push to main, scans the backend images and then
# rebuilds and restarts the backend on the Azure VM (cloudsneeker/deploy/vm).
# The VM builds its own images, so no registry is involved. GitHub signs in
# to Azure with OIDC as a managed identity that may only run commands on that
# VM, and starts cloudsneeker-deploy.service there. The web app deploys from
# Vercel. Settings are repository variables printed by vm/azure/provision.sh;
# the deploy job is skipped until AZURE_CLIENT_ID is set.

on:
  workflow_run:
    workflows: ['Cloudsneeker: Tests']
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudsneeker-deploy
  cancel-in-progress: false

permissions: {}

env:
  NEO4J_IMAGE: graphstack/dozerdb:5.26.27.0@sha256:9b54d6b3a98a76c00bd23e8e78d8c82081ff168162aebd47b25c234e092cb0a0

jobs:
  # Builds each image the VM runs from the same commit and scans it with
  # Trivy. A fixable critical CVE stops the deploy (EB-017).
  scan:
    name: Scan ${{ matrix.image }}
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image: [api, mcp, neo4j]
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      # The API image, its build cache and the scanner database fill the
      # runner's disk; drop preinstalled toolchains the build never uses.
      - name: Free runner disk space
        if: matrix.image == 'api'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /

      - name: Setup Python with uv
        if: matrix.image != 'neo4j'
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: '3.12'
          install-dependencies: 'false'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Export rebranded tree
        if: matrix.image != 'neo4j'
        run: |
          set -euo pipefail
          docker build -f cloudsneeker/deploy/docker/source.Dockerfile \
            --target tree --output type=local,dest=build/tree .
          docker build -f cloudsneeker/deploy/docker/source.Dockerfile \
            --target wheel --output type=local,dest=build/wheels .

      - name: Build ${{ matrix.image }}
        id: image
        env:
          IMAGE_NAME: ${{ matrix.image }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          tag="$(printf '%s' "$HEAD_SHA" | cut -c1-12)"
          image="cloudsneeker-${IMAGE_NAME}:${tag}"
          case "$IMAGE_NAME" in
            api)
              docker buildx build --builder default --load -t "cloudsneeker/api-base:${tag}" build/tree/api
              docker buildx build --builder default --load -t "$image" \
                --build-arg "BASE_IMAGE=cloudsneeker/api-base:${tag}" \
                -f cloudsneeker/deploy/docker/api.Dockerfile build
              ;;
            mcp)
              docker buildx build --load -t "$image" build/tree/mcp_server
              ;;
            neo4j)
              docker pull "$NEO4J_IMAGE"
              docker tag "$NEO4J_IMAGE" "$image"
              ;;
          esac
          echo "scan_name=cloudsneeker-${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      # Accepted findings go in .trivyignore.yaml with a reason. The pinned
      # third-party graph database image is reported but does not gate: it is
      # only updated by bumping NEO4J_IMAGE.
      - name: Add Cloudsneeker accepted findings
        run: |
          set -euo pipefail
          printf '\n' >> .trivyignore.yaml
          sed '1,/^vulnerabilities:/d' cloudsneeker/deploy/trivy/accepted-vulnerabilities.yaml >> .trivyignore.yaml

      - name: Scan ${{ matrix.image }} for vulnerabilities
        uses: ./.github/actions/trivy-scan
        with:
          image-name: ${{ steps.image.outputs.scan_name }}
          image-tag: ${{ steps.image.outputs.tag }}
          severity: CRITICAL,HIGH
          fail-on-severity: ${{ matrix.image == 'neo4j' && 'none' || 'critical' }}
          upload-sarif: 'false'
          create-pr-comment: 'false'

      - name: Generate SBOM for ${{ matrix.image }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.scan_name }}:${{ steps.image.outputs.tag }}
          format: cyclonedx
          output: sbom-${{ matrix.image }}.cdx.json
          scan-type: image
          version: 'v0.74.0'

      - name: Upload SBOM for ${{ matrix.image }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-${{ matrix.image }}-${{ steps.image.outputs.tag }}
          path: sbom-${{ matrix.image }}.cdx.json
          retention-days: 7

  deploy:
    name: Deploy backend
    needs: scan
    if: vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_VM: ${{ vars.AZURE_VM }}
    steps:
      - name: Build and restart on the VM
        run: |
          set -euo pipefail
          # The federated sign-in cannot refresh itself, so each command signs
          # in again with a fresh GitHub token.
          login() {
            token="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r .value)"
            az login --service-principal -u "$AZURE_CLIENT_ID" --tenant "$AZURE_TENANT_ID" \
              --federated-token "$token" --allow-no-subscriptions -o none
            az account set --subscription "$AZURE_SUBSCRIPTION_ID"
          }
          vm() {
            login
            az vm run-command invoke -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_VM" \
              --command-id RunShellScript --scripts "$1" --query "value[0].message" -o tsv
          }
          unit=cloudsneeker-deploy.service

          # A push during the nightly pause (cloudsneeker-vm-schedule.yml)
          # starts the VM for the deploy and pauses it again afterwards.
          login
          power="$(az vm get-instance-view -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_VM" \
            --query "instanceView.statuses[?starts_with(code, 'PowerState/')].code" -o tsv)"
          if [ "$power" != "PowerState/running" ]; then
            echo "VM is ${power#PowerState/}; starting it for the deploy"
            az vm start -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_VM" -o none
            trap 'login && az vm deallocate -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_VM" -o none && echo "VM paused again"' EXIT
          fi
          show="echo STATE=\$(systemctl show -p ActiveState --value $unit) RESULT=\$(systemctl show -p Result --value $unit) RUN=\$(systemctl show -p InvocationID --value $unit)"

          before="$(vm "$show" | grep -o 'RUN=[0-9a-f]*' || true)"
          vm "systemctl start --no-block $unit" >/dev/null
          echo "Deploy started on $AZURE_VM"
          for _ in $(seq 1 100); do
            sleep 60
            status="$(vm "$show" | grep -o 'STATE=.*' || true)"
            echo "$status"
            case "$status" in
              *STATE=activating*|*STATE=reloading*) continue ;;
            esac
            # Still the previous run: the new one has not started yet.
            [[ "$status" == *"$before"* && "$before" != "RUN=" ]] && continue
            vm "journalctl -u $unit --no-pager -o cat -n 40"
            [[ "$status" == *RESULT=success* ]] && exit 0
            echo "::error::The deploy on $AZURE_VM failed. Full log: journalctl -u $unit"
            exit 1
          done
          echo "::error::The deploy on $AZURE_VM did not finish in time"
          exit 1
