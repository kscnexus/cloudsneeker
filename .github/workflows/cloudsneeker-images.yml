name: 'Cloudsneeker: Publish images'
# Builds each service image in its own job and rolls only the services
# that use that image. A push of main builds every image. A manual run
# can build one image. The stack keeps its current PlatformMode.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      image:
        description: Docker image to build and deploy
        required: true
        type: choice
        default: all
        options:
          - all
          - api
          - ui
          - mcp
          - neo4j

concurrency:
  group: cloudsneeker-images-${{ github.ref }}-${{ inputs.image || 'all' }}
  cancel-in-progress: false

permissions: {}

env:
  AWS_REGION: us-east-1
  NEO4J_IMAGE: graphstack/dozerdb:5.26.27.0@sha256:9b54d6b3a98a76c00bd23e8e78d8c82081ff168162aebd47b25c234e092cb0a0

jobs:
  select:
    name: Choose images
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.set.outputs.images }}
      roll_stack: ${{ steps.set.outputs.roll_stack }}
    steps:
      - name: Select the images for this run
        id: set
        env:
          EVENT_NAME: ${{ github.event_name }}
          IMAGE: ${{ inputs.image }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$IMAGE" ] && [ "$IMAGE" != "all" ]; then
            echo "images=[\"${IMAGE}\"]" >> "$GITHUB_OUTPUT"
            echo "roll_stack=false" >> "$GITHUB_OUTPUT"
          else
            echo 'images=["api","ui","mcp","neo4j"]' >> "$GITHUB_OUTPUT"
            echo "roll_stack=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.image }}
    needs: select
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.select.outputs.images) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Python with uv
        if: matrix.image != 'neo4j'
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: '3.12'
          install-dependencies: 'false'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      # Export per job instead of uploading a shared artifact. Free-tier
      # Actions artifact storage was full and blocked every publish.
      - name: Export rebranded tree
        if: matrix.image != 'neo4j'
        run: |
          set -euo pipefail
          docker build -f cloudsneeker/deploy/docker/source.Dockerfile \
            --target tree --output type=local,dest=build/tree .
          docker build -f cloudsneeker/deploy/docker/source.Dockerfile \
            --target wheel --output type=local,dest=build/wheels .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN || 'arn:aws:iam::352285844868:role/cloudsneeker-github-actions' }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Build and push ${{ matrix.image }}
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}/cloudsneeker
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          set -euo pipefail
          tag="$(printf '%s' "$GITHUB_SHA" | cut -c1-12)"
          image="${REGISTRY}/${IMAGE_NAME}:${tag}"
          case "$IMAGE_NAME" in
            api)
              # The default builder shares the local image store. The
              # container builder would try to pull the base image from a registry.
              docker buildx build --builder default --load -t "cloudsneeker/api-base:${tag}" build/tree/api
              docker buildx build --builder default --load -t "$image" \
                --build-arg "BASE_IMAGE=cloudsneeker/api-base:${tag}" \
                -f cloudsneeker/deploy/docker/api.Dockerfile build
              docker push "$image"
              ;;
            ui)
              docker buildx build --push -t "$image" --target prod \
                --build-arg "NEXT_PUBLIC_PROWLER_RELEASE_VERSION=${tag}" build/tree/ui
              ;;
            mcp)
              docker buildx build --push -t "$image" build/tree/mcp_server
              ;;
            neo4j)
              docker pull "$NEO4J_IMAGE"
              docker tag "$NEO4J_IMAGE" "$image"
              docker push "$image"
              ;;
          esac
          echo "uri=${image}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Deploy ${{ matrix.image }}
        env:
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: |
          set -euo pipefail
          case "$IMAGE_NAME" in
            api) services="api worker beat" ;;
            ui) services="ui" ;;
            mcp) services="mcp" ;;
            neo4j) services="neo4j" ;;
          esac
          for service in $services; do
            if ! active="$(aws ecs describe-services --cluster cloudsneeker --services "$service" --query "length(services[?status=='ACTIVE'])" --output text 2>/tmp/ecs-error)"; then
              echo "Compute is parked. Published ${IMAGE_URI}."
              exit 0
            fi
            if [ "$active" != "1" ]; then
              echo "Service ${service} is not running. Published ${IMAGE_URI}."
              continue
            fi
            aws ecs describe-task-definition \
              --task-definition "$(aws ecs describe-services --cluster cloudsneeker --services "$service" --query "services[0].taskDefinition" --output text)" \
              --query taskDefinition > task.json
            IMAGE_URI="$IMAGE_URI" python3 -c "import json,os; task=json.load(open('task.json')); image=os.environ['IMAGE_URI'];
          [task.pop(key, None) for key in ('taskDefinitionArn','revision','status','requiresAttributes','compatibilities','registeredAt','registeredBy','deregisteredAt')];
          [container.update(image=image) for container in task['containerDefinitions'] if '/cloudsneeker/' in container.get('image','')];
          json.dump(task, open('task-next.json','w'))"
            arn="$(aws ecs register-task-definition --cli-input-json file://task-next.json --query taskDefinition.taskDefinitionArn --output text)"
            aws ecs update-service --cluster cloudsneeker --service "$service" --task-definition "$arn" >/dev/null
            echo "Updated ${service} to ${IMAGE_URI}"
          done

  record:
    name: Record the image tag
    needs: [select, build]
    if: needs.select.outputs.roll_stack == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN || 'arn:aws:iam::352285844868:role/cloudsneeker-github-actions' }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Keep the published tag on the current platform
        run: |
          set -euo pipefail
          tag="$(printf '%s' "$GITHUB_SHA" | cut -c1-12)"
          if ! aws cloudformation describe-stacks --stack-name cloudsneeker --query "Stacks[0].StackStatus" --output text > /tmp/stack-status 2>/tmp/stack-error; then
            echo "Platform stack is not deployed. Images are in the registry as ${tag}."
            exit 0
          fi
          echo "Stack status: $(cat /tmp/stack-status)"
          aws cloudformation describe-stacks --stack-name cloudsneeker --query "Stacks[0].Parameters" --output json > parameters.json
          IMAGE_TAG="$tag" python3 -c "import json,os; tag=os.environ['IMAGE_TAG']; current=json.load(open('parameters.json')); updated=[{'ParameterKey': item['ParameterKey'], **({'ParameterValue': tag} if item['ParameterKey']=='ImageTag' else {'UsePreviousValue': True})} for item in current]; json.dump(updated, open('parameters-next.json','w'))"
          set +e
          update_output="$(aws cloudformation update-stack --stack-name cloudsneeker --use-previous-template --capabilities CAPABILITY_NAMED_IAM --parameters file://parameters-next.json 2>&1)"
          update_status=$?
          set -e
          if [ "$update_status" -ne 0 ]; then
            if printf '%s' "$update_output" | grep -q "No updates are to be performed"; then
              echo "Services already use ${tag}."
              exit 0
            fi
            printf '%s\n' "$update_output"
            exit "$update_status"
          fi
          aws cloudformation wait stack-update-complete --stack-name cloudsneeker
