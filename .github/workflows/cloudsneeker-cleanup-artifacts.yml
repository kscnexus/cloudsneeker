name: 'Cloudsneeker: Cleanup Actions artifacts'
# Deletes every Actions artifact except the newest one so Free-tier
# storage can recover. Manual only.

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Keep only the newest artifact
    runs-on: ubuntu-latest
    steps:
      - name: Delete all but the latest artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          page=1
          ids=()
          while true; do
            response="$(curl -fsS \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/actions/artifacts?per_page=100&page=${page}")"
            count="$(printf '%s' "$response" | python3 -c 'import json,sys; print(len(json.load(sys.stdin).get("artifacts", [])))')"
            if [ "$count" = "0" ]; then
              break
            fi
            while IFS= read -r id; do
              ids+=("$id")
            done < <(printf '%s' "$response" | python3 -c 'import json,sys; [print(a["id"]) for a in json.load(sys.stdin).get("artifacts", [])]')
            if [ "$count" -lt 100 ]; then
              break
            fi
            page=$((page + 1))
          done

          total="${#ids[@]}"
          echo "Found ${total} artifact(s)."
          if [ "$total" -le 1 ]; then
            echo "Nothing to delete."
            exit 0
          fi

          # API returns newest first; keep index 0, delete the rest.
          keep="${ids[0]}"
          echo "Keeping artifact ${keep}"
          for id in "${ids[@]:1}"; do
            echo "Deleting artifact ${id}"
            curl -fsS -X DELETE \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/actions/artifacts/${id}"
          done
          echo "Deleted $((total - 1)) artifact(s); kept ${keep}."
